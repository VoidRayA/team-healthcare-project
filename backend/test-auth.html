<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Refresh Token 테스트</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Refresh Token 관리 테스트</h1>
    
    <div class="section">
        <h2>1. 로그인</h2>
        <input type="text" id="loginId" placeholder="아이디" value="newuser2025">
        <input type="password" id="password" placeholder="비밀번호" value="password123">
        <button onclick="login()">로그인</button>
        <div id="loginResult"></div>
    </div>

    <div class="section">
        <h2>2. 로그아웃</h2>
        <button onclick="logout()">로그아웃</button>
        <div id="logoutResult"></div>
    </div>

    <div class="section">
        <h2>3. 토큰 재발급</h2>
        <button onclick="refreshToken()">토큰 재발급</button>
        <div id="refreshResult"></div>
    </div>

    <div class="section">
        <h2>4. 내 정보 조회</h2>
        <button onclick="getMyInfo()">내 정보 조회</button>
        <div id="myInfoResult"></div>
    </div>

    <div class="section">
        <h2>저장된 토큰</h2>
        <pre id="tokenInfo">토큰 정보가 여기에 표시됩니다.</pre>
    </div>

    <script>
        let accessToken = '';
        let refreshTokenValue = '';

        async function login() {
            const loginId = document.getElementById('loginId').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginId, loginPw: password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    accessToken = data.accessToken;
                    refreshTokenValue = data.refreshToken;
                    
                    document.getElementById('loginResult').innerHTML = 
                        `<p class="success">로그인 성공!</p>
                         <p>사용자: ${data.loginId}</p>
                         <p>이름: ${data.guardianName}</p>`;
                    
                    updateTokenInfo();
                } else {
                    document.getElementById('loginResult').innerHTML = 
                        `<p class="error">로그인 실패: ${data.error}</p>`;
                }
            } catch (error) {
                document.getElementById('loginResult').innerHTML = 
                    `<p class="error">오류: ${error.message}</p>`;
            }
        }

        async function logout() {
            try {
                const response = await fetch('http://localhost:8080/api/auth/logout', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                
                const data = await response.json();
                document.getElementById('logoutResult').innerHTML = 
                    `<p class="success">${data.message}</p>`;
                
                // 토큰 정보 유지 (테스트용)
                updateTokenInfo();
                
            } catch (error) {
                document.getElementById('logoutResult').innerHTML = 
                    `<p class="error">오류: ${error.message}</p>`;
            }
        }

        async function refreshToken() {
            try {
                const response = await fetch('http://localhost:8080/api/auth/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refreshToken: refreshTokenValue })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    accessToken = data.accessToken;
                    document.getElementById('refreshResult').innerHTML = 
                        `<p class="success">토큰 재발급 성공!</p>`;
                    updateTokenInfo();
                } else {
                    document.getElementById('refreshResult').innerHTML = 
                        `<p class="error">재발급 실패: ${data.error}</p>`;
                }
            } catch (error) {
                document.getElementById('refreshResult').innerHTML = 
                    `<p class="error">오류: ${error.message}</p>`;
            }
        }

        async function getMyInfo() {
            try {
                const response = await fetch('http://localhost:8080/api/guardians/me', {
                    headers: { 
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('myInfoResult').innerHTML = 
                        `<p class="success">조회 성공!</p>
                         <pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    document.getElementById('myInfoResult').innerHTML = 
                        `<p class="error">조회 실패 (401 = 토큰 만료/무효)</p>`;
                }
            } catch (error) {
                document.getElementById('myInfoResult').innerHTML = 
                    `<p class="error">오류: ${error.message}</p>`;
            }
        }

        function updateTokenInfo() {
            document.getElementById('tokenInfo').textContent = 
                `Access Token: ${accessToken ? accessToken.substring(0, 50) + '...' : '없음'}\n\n` +
                `Refresh Token: ${refreshTokenValue ? refreshTokenValue.substring(0, 50) + '...' : '없음'}`;
        }
    </script>
</body>
</html>
